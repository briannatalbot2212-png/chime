<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teezy Security Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px 16px;
      color: #172033;
    }

    main {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }

    .notice {
      background: #e0f2fe;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
    }

    button {
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Teezy Security Lab</h1>

    <p class="notice">
      Security awareness demonstration.
      Do not enter a real password.
      Nothing you type is sent or stored.
    </p>

    <form id="training">
      <label for="email">Practice email</label>
      <input
        id="email"
        type="text"
        placeholder="test@example.test"
        autocomplete="off"
      >

      <label for="password">Practice password</label>
      <input
        id="password"
        type="password"
        placeholder="Use fake text only"
        autocomplete="off"
      >

      <button type="submit">Run safety check</button>
    </form>

    <p id="result" role="status"></p>
  </main>

  <script>
    document
      .getElementById("training")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("password").value = "";
        document.getElementById("email").value = "";

        document.getElementById("result").textContent =
          "Training complete: always verify the website domain before signing in.";
      });
  </script>
</body>
</html>
